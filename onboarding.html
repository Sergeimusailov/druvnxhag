<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Онбординг — Арена Карт</title>
  <link rel="stylesheet" href="css/match.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body>
  <svg width="0" height="0" style="position: absolute">
    <defs>
      <mask id="card-mask-def" maskUnits="userSpaceOnUse" x="0" y="0" width="118" height="118" fill="black">
        <rect fill="white" width="118" height="118"/>
        <path d="M105 1C111.627 1 117 6.37258 117 13V105C117 111.627 111.627 117 105 117H13C6.37258 117 1 111.627 1 105V13C1 6.37258 6.37258 1 13 1H105ZM13 9C10.7909 9 9 10.7909 9 13V45.664C9 45.8502 9.14978 46.0017 9.33594 46.0039C16.3604 46.1821 22 51.9326 22 59C22 65.5022 17.2264 70.8894 10.9926 71.8483C9.90082 72.0162 9 72.8954 9 74V105C9 107.209 10.7909 109 13 109H44C45.1046 109 45.9838 108.099 46.1517 107.007C47.1106 100.774 52.4978 96 59 96C65.5022 96 70.8894 100.774 71.8483 107.007C72.0162 108.099 72.8954 109 74 109H105C107.209 109 109 107.209 109 105V74C109 72.8954 108.099 72.0162 107.007 71.8483C100.774 70.8894 96 65.5022 96 59C96 52.4978 100.774 47.1106 107.007 46.1517C108.099 45.9838 109 45.1046 109 44V13C109 10.7909 107.209 9 105 9H72.336C72.1498 9 71.9983 9.14978 71.9961 9.33594C71.8179 16.3604 66.0674 22 59 22C51.9326 22 46.1821 16.3604 46.0039 9.33594C46.0017 9.14978 45.8502 9 45.664 9H13Z"/>
      </mask>
    </defs>
  </svg>
  <main class="match">
    <div class="match-topbar">
      <a class="icon-btn back-btn" href="index.html" aria-label="Назад">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5 L7 12 L15 19" stroke="#428bf9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="match-title">
        <div class="match-title-text">Онбординг</div>
        <div class="match-status" id="turnStatus">Обучение</div>
      </div>
      <button class="icon-btn info-btn" id="infoBtn" aria-label="Подсказки">i</button>
    </div>

    <div class="players-row">
      <div class="player player-you">
        <div class="avatar-wrap">
          <img class="avatar avatar-you" src="assets/Ava03.png" alt="Сергей М.">
          <div class="deck-badge" id="deckYou">5</div>
        </div>
        <div class="player-name">Сергей М.</div>
      </div>

      <div class="timer-wrap">
        <svg class="timer-ring" viewBox="0 0 80 80">
          <circle class="timer-track" cx="40" cy="40" r="34"/>
          <circle class="timer-progress" cx="40" cy="40" r="34"/>
        </svg>
        <span class="timer-icon" aria-hidden="true">
          <img src="assets/timer" alt="">
        </span>
      </div>

      <div class="player player-opponent">
        <div class="avatar-wrap">
          <div class="deck-badge" id="deckOpp">5</div>
          <img class="avatar avatar-opp" src="assets/Ava01.png" alt="Константин К.">
        </div>
        <div class="player-name">Константин К.</div>
        <div class="opp-status" id="oppStatus">
          <span id="oppStatusText">Думает</span><span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>
    </div>

    <div class="field-panel">
      <div class="score-panel">
        <div class="score-row">
          <span class="score-num score-you" id="scoreYou">0</span>
          <span class="score-label">Клеток занято</span>
          <span class="score-num score-opp" id="scoreOpp">0</span>
        </div>
        <div class="score-bar" id="scoreBar"></div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="turn-overlay" id="turnOverlay"><span id="turnOverlayText"></span></div>
      </div>
    </div>

    <div class="hand" id="hand"></div>
  </main>

  <div class="onb-blocker" id="onbBlocker"></div>
  <div class="onb-scrim" id="onbScrim"></div>
  <div class="spotlight" id="spotlight"></div>
  <div class="tooltip" id="tooltip">
    <div class="tooltip-tail" id="tooltipTail"></div>
    <div class="tooltip-body">
      <div class="tooltip-step" id="tooltipStep"></div>
      <p class="tooltip-text" id="tooltipText"></p>
      <div class="tooltip-hint" id="tooltipHint"></div>
      <button class="tooltip-btn" id="tooltipBtn">Продолжить</button>
    </div>
  </div>

  <script src="js/vendor/anime.min.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
