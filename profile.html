<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Профиль — Арена Карт</title>
  <link rel="stylesheet" href="css/v2.css">
  <link rel="stylesheet" href="css/match.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <svg width="0" height="0" style="position: absolute">
    <defs>
      <mask id="card-mask-def" maskUnits="userSpaceOnUse" x="0" y="0" width="118" height="118" fill="black">
        <rect fill="white" width="118" height="118"/>
        <path d="M105 1C111.627 1 117 6.37258 117 13V105C117 111.627 111.627 117 105 117H13C6.37258 117 1 111.627 1 105V13C1 6.37258 6.37258 1 13 1H105ZM13 9C10.7909 9 9 10.7909 9 13V45.664C9 45.8502 9.14978 46.0017 9.33594 46.0039C16.3604 46.1821 22 51.9326 22 59C22 65.5022 17.2264 70.8894 10.9926 71.8483C9.90082 72.0162 9 72.8954 9 74V105C9 107.209 10.7909 109 13 109H44C45.1046 109 45.9838 108.099 46.1517 107.007C47.1106 100.774 52.4978 96 59 96C65.5022 96 70.8894 100.774 71.8483 107.007C72.0162 108.099 72.8954 109 74 109H105C107.209 109 109 107.209 109 105V74C109 72.8954 108.099 72.0162 107.007 71.8483C100.774 70.8894 96 65.5022 96 59C96 52.4978 100.774 47.1106 107.007 46.1517C108.099 45.9838 109 45.1046 109 44V13C109 10.7909 107.209 9 105 9H72.336C72.1498 9 71.9983 9.14978 71.9961 9.33594C71.8179 16.3604 66.0674 22 59 22C51.9326 22 46.1821 16.3604 46.0039 9.33594C46.0017 9.14978 45.8502 9 45.664 9H13Z"/>
      </mask>
    </defs>
  </svg>

  <main class="v2-app profile-app">
    <div class="v2-appbar">
      <a class="v2-icon-btn" href="v2.html" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 2L16 16M16 2L2 16" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
      <div class="v2-appbar-title">Профиль</div>
      <button class="v2-icon-btn" id="profileSettingsBtn" aria-label="Настройки">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.4" stroke="#e8e8e8" stroke-width="1.5"/><path d="M9 2.7v1.4M9 13.9v1.4M15.3 9h-1.4M4.1 9H2.7M13.2 4.8l-1 1M5.8 12.2l-1 1M13.2 13.2l-1-1M5.8 5.8l-1-1" stroke="#e8e8e8" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section class="profile-header">
      <div class="profile-avatar-wrap">
        <img class="profile-ring" src="assets/v2-profile-ring.png" alt="">
        <img class="profile-avatar" src="assets/v2-avatar-demo.png" alt="Александр">
        <div class="profile-deck-flair"></div>
      </div>

      <div class="profile-rank-row">
        <svg width="9" height="20" viewBox="0 0 9 20" fill="none"><path d="M7.5 1 1.5 10l6 9" stroke="#ffdd2d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Т-Ранжира</span>
        <svg width="9" height="20" viewBox="0 0 9 20" fill="none"><path d="M1.5 1 7.5 10l-6 9" stroke="#ffdd2d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 class="profile-name">Александр</h1>
      <div class="profile-clan-row">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1.8 15.5 4v4.4c0 4.1-2.5 7.1-5.5 8.8-3-1.7-5.5-4.7-5.5-8.8V4L10 1.8Z" fill="#f2b53c" stroke="#c98a1e" stroke-width="0.8"/><path d="M8.2 9.8 9.4 11l2.4-2.6" stroke="#333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Клан капкан</span>
      </div>
    </section>

    <div class="profile-chip-row" id="profileChipRow">
      <span class="profile-chip-indicator" id="profileChipIndicator"></span>
      <button class="profile-chip profile-chip-active" data-tab="achievements">Ачивки</button>
      <button class="profile-chip" data-tab="stats">Статистика</button>
      <button class="profile-chip" data-tab="deck">Любимая колода</button>
    </div>

    <section class="profile-tab-content">
      <div class="profile-tab-track" id="profileTabTrack">
        <div class="profile-tab-panel" id="tabAchievements">
          <div class="achievements-grid" id="achievementsGrid"></div>
        </div>

        <div class="profile-tab-panel" id="tabStats">
          <p class="stats-percent">83%</p>
          <div class="stats-percent-label">
            <span>Побед</span>
            <span class="stats-tooltip-ic" aria-hidden="true">i</span>
          </div>
          <div class="stats-cells">
            <div class="stats-cell"><span>Победы</span><strong>25</strong></div>
            <div class="stats-cell"><span>Поражения</span><strong>3</strong></div>
            <div class="stats-cell"><span>Ничьи</span><strong>2</strong></div>
            <div class="stats-cell"><span>Собрано карт</span><strong id="statsCollectedCount">2</strong></div>
          </div>
        </div>

        <div class="profile-tab-panel" id="tabDeck">
          <div class="deck-grid" id="favoriteDeckGrid"></div>
        </div>
      </div>
    </section>

    <nav class="v2-tabbar">
      <a class="v2-tab" href="v2.html">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="8" width="19" height="9.5" rx="4.75" stroke="currentColor" stroke-width="1.6"/><path d="M7.2 11v3.2M5.6 12.6h3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.2" cy="11.5" r="1" fill="currentColor"/><circle cx="17.4" cy="13.7" r="1" fill="currentColor"/></svg>
        <span class="v2-tab-label">Игра</span>
      </a>
      <button class="v2-tab" id="v2TasksBtn">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="17" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9h17" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 13l1.8 1.8 3.6-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="v2-tab-label">Задания</span>
      </button>
      <button class="v2-tab" id="v2GiftsBtn">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="9.5" width="17" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17v3.5h-17z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9.5V20" stroke="currentColor" stroke-width="1.6"/><path d="M12 9.5c0-2.2-1.6-4-3.6-4S5 6.6 5 8s1.6 1.5 3.6 1.5H12ZM12 9.5c0-2.2 1.6-4 3.6-4S19 6.6 19 8s-1.6 1.5-3.6 1.5H12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="v2-tab-label">Подарки</span>
      </button>
      <button class="v2-tab" id="v2LeaguesBtn">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 4h10v5.5a5 5 0 0 1-10 0V4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 5.5H4.5a1 1 0 0 0-1 1v1A3.5 3.5 0 0 0 7 11M17 5.5h2.5a1 1 0 0 1 1 1v1A3.5 3.5 0 0 1 17 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 14.5V17M9 20h6M9.5 20c0-1.7.5-2.7 2.5-3 2 .3 2.5 1.3 2.5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="v2-tab-label">Лиги</span>
      </button>
      <a class="v2-tab v2-tab-active" href="profile.html">
        <span class="v2-tab-highlight"></span>
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="v2-tab-label">Профиль</span>
      </a>
    </nav>
  </main>

  <script src="js/cards.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
