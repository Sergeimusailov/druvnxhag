<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Матч — Арена Карт</title>
  <link rel="stylesheet" href="css/match.css">
</head>
<body>
  <main class="match">
    <div class="match-topbar">
      <a class="icon-btn back-btn" href="index.html" aria-label="Назад">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5 L7 12 L15 19" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="match-title">
        <div class="match-title-text">Матч</div>
        <div class="match-status" id="turnStatus">Ваш ход</div>
      </div>
      <button class="icon-btn info-btn" id="infoBtn" aria-label="Подсказки">i</button>
    </div>

    <div class="players-row">
      <div class="player player-you">
        <div class="avatar-wrap">
          <div class="avatar avatar-you">СМ</div>
          <div class="deck-badge" id="deckYou">5</div>
        </div>
        <div class="player-name">Сергей М.</div>
      </div>

      <div class="timer-wrap">
        <svg class="timer-ring" viewBox="0 0 80 80">
          <circle class="timer-track" cx="40" cy="40" r="34"/>
          <circle class="timer-progress" cx="40" cy="40" r="34"/>
        </svg>
      </div>

      <div class="player player-opponent">
        <div class="avatar-wrap">
          <div class="deck-badge" id="deckOpp">5</div>
          <div class="avatar avatar-opp">КК</div>
        </div>
        <div class="player-name">Константин К.</div>
      </div>
    </div>

    <div class="score-row">
      <span class="score-num score-you" id="scoreYou">0</span>
      <span class="score-label">Клеток занято</span>
      <span class="score-num score-opp" id="scoreOpp">0</span>
    </div>
    <div class="score-bar" id="scoreBar"></div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="turn-overlay" id="turnOverlay"><span id="turnOverlayText"></span></div>
    </div>

    <div class="hand" id="hand"></div>
  </main>

  <script src="js/cards.js"></script>
  <script src="js/match.js"></script>
</body>
</html>
