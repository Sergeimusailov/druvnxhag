<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Арена Карт</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app">
    <div class="topbar">
      <button class="link-btn" id="closeBtn">Закрыть</button>
      <div class="coins-pill">
        <span class="coin-icon"></span>
        <span>320</span>
      </div>
    </div>

    <div class="secondrow">
      <button class="pill pill-bug" id="bugBtn">
        <span class="bug-icon">🐛</span>
        <span>Сообщить о баге</span>
      </button>
      <button class="circle-btn" id="helpBtn">?</button>
    </div>

    <section class="hero">
      <div class="logo-wrap">
        <span class="star star-pink"></span>
        <span class="star star-purple"></span>
        <span class="star star-green"></span>
        <h1 class="logo">
          <span class="logo-line logo-line--white">Арена</span>
          <span class="logo-line logo-line--gradient">Карт</span>
        </h1>
      </div>
      <p class="subtitle">Собирайте колоду и сражайтесь<br>с другими игроками</p>

      <button class="btn btn-primary" id="findMatchBtn">Найти матч</button>
      <button class="btn btn-secondary" id="trainBtn">Тренироваться</button>
    </section>

    <section class="bottom-grid">
      <button class="card card-shop" id="shopBtn">
        <span class="badge-dot"></span>
        <span class="card-title">Магазин<br>карт</span>
        <span class="card-icon icon-shop" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56">
            <rect x="18" y="18" width="11" height="16" rx="4" transform="rotate(-10 23.5 26)" fill="#e3e3e8"/>
            <rect x="28" y="16" width="11" height="16" rx="4" fill="#cfcfd6"/>
            <path d="M11 28 L46 28 L42 54 L15 54 Z" fill="#f2c94c"/>
            <path d="M19 28 C19 21 23 16 28.5 16" fill="none" stroke="#caa030" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M38 28 C38 21 34 16 28.5 16" fill="none" stroke="#caa030" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
      </button>

      <button class="card card-collection" id="collectionBtn">
        <span class="card-title">Коллекция<br>карт</span>
        <span class="card-icon icon-collection" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="48" height="48">
            <rect x="6" y="18" width="24" height="34" rx="5" transform="rotate(-12 18 35)" fill="#f7a8c4"/>
            <rect x="20" y="16" width="24" height="34" rx="5" fill="#d9d9df"/>
            <rect x="34" y="18" width="24" height="34" rx="5" transform="rotate(12 46 35)" fill="#8fe3b0"/>
          </svg>
        </span>
      </button>

      <button class="card card-stats" id="statsBtn">
        <span class="card-title">Статистика</span>
        <span class="card-icon icon-stats" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="44" height="44">
            <circle cx="32" cy="32" r="26" fill="#3a3a3f"/>
            <path d="M32 32 L32 6 A26 26 0 0 1 55 44 Z" fill="#5b8def"/>
            <path d="M32 32 L55 44 A26 26 0 0 1 15 55 Z" fill="#f28fb0"/>
            <path d="M32 32 L15 55 A26 26 0 0 1 32 6 Z" fill="#f4cd58"/>
            <circle cx="32" cy="32" r="11" fill="#1c1c1f"/>
          </svg>
        </span>
      </button>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
