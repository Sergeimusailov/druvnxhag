<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Арена Карт</title>
  <link rel="stylesheet" href="css/v2.css">
</head>
<body>
  <main class="v2-app">
    <div class="v2-appbar">
      <a class="v2-icon-btn" href="index.html" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 2L16 16M16 2L2 16" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
      <button class="v2-icon-btn" id="v2HelpBtn" aria-label="Подсказки">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M6.7 6.8c.2-1 1.1-1.8 2.3-1.8 1.3 0 2.4.9 2.4 2.1 0 1-.6 1.5-1.4 2.1-.7.5-1 .9-1 1.7" stroke="#e8e8e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="13.2" r="1" fill="#e8e8e8"/></svg>
      </button>
    </div>

    <section class="v2-hero">
      <img class="v2-logo" src="assets/v2-logo.png" alt="Арена Карт">
      <p class="v2-subtitle">Собирайте колоду и сражайтесь с другими игроками</p>

      <div class="v2-btn-group">
        <a class="v2-btn v2-btn-primary" href="match.html">Найти матч</a>
        <a class="v2-btn v2-btn-secondary" href="onboarding.html">Тренироваться</a>
      </div>
    </section>

    <nav class="v2-tabbar">
      <a class="v2-tab v2-tab-active" href="v2.html">
        <span class="v2-tab-highlight"></span>
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="8" width="19" height="9.5" rx="4.75" stroke="currentColor" stroke-width="1.6"/><path d="M7.2 11v3.2M5.6 12.6h3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15.2" cy="11.5" r="1" fill="currentColor"/><circle cx="17.4" cy="13.7" r="1" fill="currentColor"/></svg>
        <span class="v2-tab-label">Игра</span>
      </a>
      <button class="v2-tab" id="v2TasksBtn">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="17" rx="4" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9h17" stroke="currentColor" stroke-width="1.6"/><path d="M8.3 13l1.8 1.8 3.6-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="v2-tab-label">Задания</span>
      </button>
      <button class="v2-tab" id="v2GiftsBtn">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="9.5" width="17" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17v3.5h-17z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9.5V20" stroke="currentColor" stroke-width="1.6"/><path d="M12 9.5c0-2.2-1.6-4-3.6-4S5 6.6 5 8s1.6 1.5 3.6 1.5H12ZM12 9.5c0-2.2 1.6-4 3.6-4S19 6.6 19 8s-1.6 1.5-3.6 1.5H12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="v2-tab-label">Подарки</span>
      </button>
      <button class="v2-tab" id="v2LeaguesBtn">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 4h10v5.5a5 5 0 0 1-10 0V4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 5.5H4.5a1 1 0 0 0-1 1v1A3.5 3.5 0 0 0 7 11M17 5.5h2.5a1 1 0 0 1 1 1v1A3.5 3.5 0 0 1 17 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 14.5V17M9 20h6M9.5 20c0-1.7.5-2.7 2.5-3 2 .3 2.5 1.3 2.5 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="v2-tab-label">Лиги</span>
      </button>
      <a class="v2-tab" href="profile.html">
        <svg class="v2-tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.2" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="v2-tab-label">Профиль</span>
      </a>
    </nav>
  </main>

  <script src="js/v2.js"></script>
</body>
</html>
